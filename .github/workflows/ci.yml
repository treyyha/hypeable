name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  changes:
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-docs-only.mjs

  build:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm run --if-present typecheck
      - run: pnpm run --if-present lint
      # TODO: make this blocking again once the 6 upstream failures in docs/KNOWN-ISSUES.md are fixed or deleted.
      - name: Tests
        continue-on-error: true
        run: pnpm --if-present test
      - run: pnpm run --if-present build
      - run: pnpm audit --audit-level=high || true

  e2e:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
          restore-keys: playwright-${{ runner.os }}-
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm e2e

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Conventional commit titles
        run: |
          bad=0
          for m in $(git rev-list origin/${{ github.base_ref }}..HEAD); do
            s=$(git log -1 --format=%s $m)
            echo "$s" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|security)(\([a-z0-9._/-]+\))?!?: .+|^Merge' || { echo "bad: $s"; bad=1; }
          done
          exit $bad
